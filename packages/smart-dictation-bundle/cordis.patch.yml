- insert:
    - id: speech-to-text
      name: '@deepseek-ai/dsh-experimental-speech-to-text'
      config:
        defaultProvider: gigaam-local
    - id: speech-to-text-gigaam
      name: '@triagmas/dsh-smart-dictation-provider'
      config:
        dataRoot: !!js dshHomePath('speech-to-text', 'gigaam-v3')
        glossaryRoot: !!js dshHomePath('smart-dictation')
        threads: 4
    - id: api-speech-to-text
      name: '@deepseek-ai/dsh-experimental-api-speech-to-text'
    - id: smart-dictation-client
      name: '@triagmas/dsh-smart-dictation-client'
